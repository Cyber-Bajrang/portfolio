<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC One-Way: Broadcaster</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; text-align: center; }
        video { width: 100%; max-width: 500px; background: #222; border-radius: 8px; transform: scaleX(-1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        #status { color: #666; font-style: italic; margin: 10px 0; }
    </style>
</head>
<body>

    <h2>Broadcaster (Sender)</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    
    <div id="status">Disconnected from signaling server.</div>
    
    <button id="startBtn">1. Start Camera & Mic</button>
    <button id="joinBtn" disabled>2. Join Broadcast Room</button>

    <script>
        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const joinBtn = document.getElementById('joinBtn');
        const statusDiv = document.getElementById('status');

        const ROOM_ID = "stream_room_1"; // Both sender and receiver must use this exact string
        const SIGNALING_URL = "wss://64.227.140.149:8765";
        
        let localStream = null;
        let peerConnection = null;
        let ws = null;

        // Standard public Google STUN server configuration
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // Step 1: Capture Local Hardware Media
        startBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                startBtn.disabled = true;
                joinBtn.disabled = false;
                statusDiv.innerText = "Camera captured. Ready to join room.";
            } catch (err) {
                console.error("Error accessing media:", err);
                statusDiv.innerText = "Error: Camera/Mic access denied.";
            }
        });

        // Step 2: Connect to Signaling Server and Join Room
        joinBtn.addEventListener('click', () => {
            joinBtn.disabled = true;
            ws = new WebSocket(SIGNALING_URL);

            ws.onopen = () => {
                statusDiv.innerText = "Connected to signaling server. Joining room...";
                ws.send(jsonStr({ action: "join", room_id: ROOM_ID }));
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.status === "joined") {
                    statusDiv.innerText = `Successfully joined room: ${msg.room_id}. Waiting for viewers...`;
                }
                
                // Triggers when a viewer joins the room
                if (msg.status === "peer_connected") {
                    statusDiv.innerText = "Viewer connected! Starting handshake...";
                    initiateCall();
                }

                // Handles incoming Answer SDP and ICE candidates back from the Viewer
                if (msg.status === "msg_received") {
                    const payload = msg.payload;
                    if (payload.sdp) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                        statusDiv.innerText = "Handshake complete. Streaming live!";
                    } else if (payload.ice) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(payload.ice));
                    }
                }
            };
        });

        // Step 3: Setup WebRTC connection and send an Offer
        async function initiateCall() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Force this connection to ONLY push media outgoing
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.getTransceivers().forEach(transceiver => {
                transceiver.direction = "sendonly";
            });

            // Gather network routes and relay them via the server
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(jsonStr({ action: "relay", payload: { ice: event.candidate } }));
                }
            };

            // Create connection offer configuration string
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            ws.send(jsonStr({ action: "relay", payload: { sdp: offer } }));
        }

        function jsonStr(obj) { return JSON.stringify(obj); }
    </script>
</body>
</html>
